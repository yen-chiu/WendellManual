name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  jekyll-build:
    name: Build (jekyll gem)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]  # 可以扩展为其他操作系统, 如[ubuntu-latest, windows-latest, macos-latest]
        jekyll-version: [4.3]  # 保留常用的 Jekyll 版本, 如[3.9, 4.3]
        ruby-version: ["3.2"]  # 选择常用的 Ruby 版本, 如["3.1", "3.2", "3.3"]
    runs-on: ${{ matrix.os }}
    steps:
      # 检出代码
      - uses: actions/checkout@v4

      # 设置 Ruby 环境
      - name: Setup Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: false

      # 安装 Jekyll 依赖
      - name: Bundle Install (Jekyll ${{ matrix.jekyll-version }})
        run: bundle install
        env:
          BUNDLE_GEMFILE: fixtures/Gemfile-jekyll-${{ matrix.jekyll-version }}

      # 初始化搜索功能
      - name: Init Search
        run: bundle exec rake search:init
        env:
          BUNDLE_GEMFILE: fixtures/Gemfile-jekyll-${{ matrix.jekyll-version }}

      # 构建 Jekyll 网站
      - name: Build Site
        run: bundle exec jekyll build
        env:
          BUNDLE_GEMFILE: fixtures/Gemfile-jekyll-${{ matrix.jekyll-version }}

  validate:
    name: Validate HTML
    strategy:
      matrix:
        os: [ubuntu-latest]  # 可以扩展为其他操作系统
    runs-on: ${{ matrix.os }}
    steps:
      # 检出代码
      - uses: actions/checkout@v4

      # 设置 Ruby 环境
      # 跟随 .ruby-version（3.3.13）：Gemfile.lock 里 listen → async / console /
      # io-event 已经要求 Ruby >= 3.3，用 3.2 会在 bundle install 阶段直接失败。
      # 这也保证 CI 与部署用的是同一个 Ruby。
      - name: Setup Ruby (.ruby-version)
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true  # 启用缓存

      # 构建 Jekyll 网站（不带 baseurl，让站内链接是根路径）
      - name: Build Site
        run: bundle exec jekyll build --baseurl ""

      # 只校验站内链接与 HTML 结构；外链关掉，避免第三方站点波动导致误报
      - name: Test with html-proofer
        run: bundle exec htmlproofer _site --disable-external --ignore-urls "/github.com/,/web.archive.org/"
        env:
          NOKOGIRI_USE_SYSTEM_LIBRARIES: true

  assets:
    name: Test CSS and JS
    strategy:
      matrix:
        os: [ubuntu-latest]  # 可以扩展为其他操作系统
        node-version: [20.x]  # Node.js 版本
    runs-on: ${{ matrix.os }}
    steps:
      # 检出代码
      - uses: actions/checkout@v4

      # 设置 Node.js 环境
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # 安装依赖
      - run: npm install

      # 运行测试
      - run: npm test
