# 构建并部署 WendellManual 到 GitHub Pages
# ---------------------------------------------------------------------------
# 说明：
#   - 用 Actions 构建（而不是 Pages 的 legacy 构建），这样可以自由使用
#     Gemfile 里的任意 Jekyll 版本与插件
#   - baseurl 由 configure-pages 输出的 base_path 决定：
#       项目站点   → /WendellManual
#       自定义域名 → 空
#     所以换域名时不用改这个文件
# ---------------------------------------------------------------------------
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          cache-version: 1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
