<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>背景 / 署名 方案预览 · 与念真聊天中</title>
  <style>
    /* =====================================================================
       方案预览页（不属于站点本身，只用来对比方向）
       背景 4 选 1：current / aurora / firefly / studio
       署名 4 选 1：plain / colophon / plaque / none
       ===================================================================== */

    :root {
      --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "SFMono-Regular", Consolas, "JetBrains Mono", Menlo, monospace;

      --teal: #22c3aa;
      --teal-bright: #5fe3cb;

      --bg-0: #050b0a;
      --bg-1: #0a1613;
      --bg-2: #030807;
      --panel: #0f1a19;
      --panel-hi: #15211f;
      --panel-line: rgba(232, 242, 239, 0.07);

      --ink: #e8f2ef;
      --ink-2: #b3c6c1;
      --muted: #7f948f;
      --muted-2: #5d716c;

      --line: rgba(232, 242, 239, 0.08);
      --line-2: rgba(232, 242, 239, 0.16);

      --halo: rgba(34, 195, 170, 0.14);
      --warm: #f2c99b;

      --sig-name: #b3c6c1;
      --sig-link: #7f948f;
      --sig-hover: #5fe3cb;

      --aurora-1: rgba(34, 195, 170, 0.30);
      --aurora-2: rgba(46, 118, 176, 0.18);
      --aurora-3: rgba(242, 201, 155, 0.11);
      --grid-line: rgba(232, 242, 239, 0.065);
      --lamp: rgba(34, 195, 170, 0.26);
      --lamp-warm: rgba(242, 201, 155, 0.07);
      --vignette: rgba(2, 7, 6, 0.52);

      color-scheme: dark;
    }

    html[data-theme="light"] {
      --bg-0: #e0efeb;
      --bg-1: #f3fbf9;
      --bg-2: #d2e6e1;
      --panel: #ffffff;
      --panel-hi: #fbfefd;
      --panel-line: rgba(12, 60, 52, 0.08);

      --ink: #16211f;
      --ink-2: #3f5350;
      --muted: #6b807b;
      --muted-2: #8ea39e;

      --line: rgba(12, 60, 52, 0.1);
      --line-2: rgba(12, 60, 52, 0.2);

      --halo: rgba(34, 195, 170, 0.16);
      --sig-name: #1d2b27;
      --sig-link: #36473f;
      --sig-hover: #0a6555;
      --aurora-1: rgba(34, 195, 170, 0.26);
      --aurora-2: rgba(46, 118, 176, 0.12);
      --aurora-3: rgba(242, 201, 155, 0.24);
      --grid-line: rgba(12, 60, 52, 0.055);
      --lamp: rgba(34, 195, 170, 0.20);
      --lamp-warm: rgba(242, 201, 155, 0.22);
      --vignette: rgba(10, 60, 50, 0.22);

      color-scheme: light;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; height: 100%; }

    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg-0);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- 舞台与光层 ---------- */

    .stage {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
    }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    /* 天光：不再在顶部中央打一个比卡片还亮的洞，只保留很轻的上下明度差 */
    .a-wash {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 58%, var(--bg-2) 100%),
        radial-gradient(70% 50% at 84% 92%, rgba(34, 195, 170, 0.05), transparent 64%);
    }

    .a-aurora i {
      position: absolute;
      border-radius: 50%;
      will-change: transform;
      transform: translate3d(0, 0, 0);
      background: radial-gradient(closest-side, var(--c), transparent 72%);
    }

    .a-aurora i:nth-child(1) {
      width: 66vmax; height: 66vmax;
      left: -20vmax; top: -32vmax;
      --c: var(--aurora-1);
      animation: drift-a 54s ease-in-out infinite alternate;
    }

    .a-aurora i:nth-child(2) {
      width: 52vmax; height: 52vmax;
      right: -14vmax; top: 4vmax;
      --c: var(--aurora-2);
      animation: drift-b 71s ease-in-out infinite alternate;
    }

    .a-aurora i:nth-child(3) {
      width: 58vmax; height: 58vmax;
      left: 18vmax; bottom: -34vmax;
      --c: var(--aurora-3);
      animation: drift-c 88s ease-in-out infinite alternate;
    }

    .a-aurora i:nth-child(4) {
      width: 34vmax; height: 34vmax;
      right: 12vmax; bottom: -12vmax;
      --c: var(--aurora-1);
      opacity: 0.55;
      animation: drift-a 63s ease-in-out infinite alternate-reverse;
    }

    @keyframes drift-a {
      0%   { transform: translate3d(-4%, -2%, 0) scale(1); }
      50%  { transform: translate3d(3%, 4%, 0) scale(1.07); }
      100% { transform: translate3d(-1%, 2%, 0) scale(1.02); }
    }

    @keyframes drift-b {
      0%   { transform: translate3d(2%, -3%, 0) scale(1.03); }
      50%  { transform: translate3d(-4%, 3%, 0) scale(0.97); }
      100% { transform: translate3d(1%, -1%, 0) scale(1.05); }
    }

    @keyframes drift-c {
      0%   { transform: translate3d(-2%, 2%, 0) scale(0.98); }
      50%  { transform: translate3d(4%, -3%, 0) scale(1.06); }
      100% { transform: translate3d(0, 1%, 0) scale(1); }
    }

    /* 灯：卡片背后的一束光，位置比卡片中心略高，像台灯打在桌上 */
    .a-lamp {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(34% 30% at 50% 30%, var(--lamp), transparent 70%),
        radial-gradient(26% 22% at 50% 26%, var(--lamp-warm), transparent 70%);
      transition: opacity 1.4s ease;
    }

    /* 念真打字时，房间的灯稍微亮一点：这是全站唯一一处“有人还在”的暗示 */
    .stage.is-typing .a-lamp { opacity: 1.4; }

    /* 桌面：卡片下方一块被灯照到的台面；网格只出现在光斑里，不做全屏方格纸 */
    .a-desk {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(66% 30% at 50% 78%, rgba(34, 195, 170, 0.15), transparent 70%),
        radial-gradient(78% 26% at 50% 92%, rgba(242, 201, 155, 0.05), transparent 72%);
    }

    .a-desk::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 40px 40px;
      -webkit-mask-image: radial-gradient(58% 22% at 50% 86%, #000 16%, transparent 76%);
      mask-image: radial-gradient(58% 22% at 50% 86%, #000 16%, transparent 76%);
    }

    #dust {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.85;
      will-change: transform;
    }

    .a-grain {
      position: absolute;
      inset: 0;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="160" height="160" filter="url(%23n)" opacity="0.62"/></svg>');
      background-size: 160px 160px;
      opacity: 0.055;
      mix-blend-mode: overlay;
    }

    html[data-theme="light"] .a-grain { opacity: 0.05; mix-blend-mode: multiply; }

    .a-vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(118% 88% at 50% 42%, transparent 32%, var(--vignette) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.28) 0%, transparent 18%, transparent 74%, rgba(0, 0, 0, 0.42) 100%);
    }

    html[data-theme="light"] .a-vignette {
      background:
        radial-gradient(118% 88% at 50% 42%, transparent 40%, var(--vignette) 100%);
    }

    /* ---------- 四种背景的开关 ---------- */

    [data-bg="current"] .ambient { display: none; }
    [data-bg="current"] .stage {
      background: radial-gradient(ellipse farthest-corner at 50% 0, #13302c 0%, #07110f 100%);
    }
    html[data-theme="light"] [data-bg="current"] .stage {
      background: radial-gradient(ellipse farthest-corner at 50% 0, #d9f5ef 0%, #a9e7db 100%);
    }

    [data-bg="aurora"] .a-desk,
    [data-bg="firefly"] .a-desk,
    [data-bg="current"] .a-desk { display: none; }

    [data-bg="studio"] .a-aurora { opacity: 0; }
    [data-bg="studio"] .a-desk { display: block; }
    [data-bg="firefly"] .a-aurora { opacity: 0.55; }
    [data-bg="firefly"] .a-lamp { opacity: 1.15; }

    .no-motion .a-aurora i,
    .no-motion #dust { animation: none !important; }

    @media (prefers-reduced-motion: reduce) {
      .a-aurora i { animation: none !important; }
    }

    /* ---------- 手机卡片（示意） ---------- */

    .phone {
      position: relative;
      z-index: 1;
      width: 360px;
      height: calc(100dvh - 60px);
      display: flex;
      flex-direction: column;
      border-radius: 22px;
      overflow: hidden;
      background: linear-gradient(180deg, var(--panel-hi), var(--panel));
      border: 1px solid var(--panel-line);
      box-shadow:
        0 30px 70px -30px rgba(0, 0, 0, 0.9),
        0 0 72px var(--halo),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: box-shadow 0.6s ease;
    }

    .phone__head {
      flex: 0 0 46px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    .ph-btn {
      display: inline-grid;
      place-items: center;
      width: 26px; height: 26px;
      border-radius: 50%;
      font-size: 13px;
      color: var(--muted);
    }

    .ph-apps { margin-left: auto; letter-spacing: -2px; }
    .ph-title { flex: 1; text-align: center; font-size: 13px; color: var(--ink-2); }

    .phone__body {
      flex: 1;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.12));
    }

    html[data-theme="light"] .phone__body { background: linear-gradient(180deg, #f7fdfb, #eef8f6); }

    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .bubble--her {
      align-self: flex-start;
      background: #1b272a;
      color: #dce7e4;
      border-bottom-left-radius: 6px;
    }

    html[data-theme="light"] .bubble--her { background: #fff; color: #2b3d3a; box-shadow: 0 4px 14px rgba(12, 60, 52, 0.06); }

    .bubble--me {
      align-self: flex-end;
      background: linear-gradient(20deg, #2aa9bd 0%, #22c3aa 100%);
      color: #fff;
      border-bottom-right-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dots { display: inline-flex; gap: 3px; }
    .dots i {
      width: 4px; height: 4px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      transition: transform 0.4s ease;
    }
    .stage.is-typing .dots i { animation: dot 1.1s ease-in-out infinite; }
    .stage.is-typing .dots i:nth-child(2) { animation-delay: 0.15s; }
    .stage.is-typing .dots i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes dot { 0%, 100% { transform: translateY(0); opacity: 0.55; } 50% { transform: translateY(-2px); opacity: 1; } }

    .phone__foot {
      flex: 0 0 54px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13.5px;
    }

    /* ---------- 署名：四种方案 ---------- */

    .sign { position: fixed; z-index: 2; display: none; }

    [data-sign="signature"] .sign--signature { display: flex; }
    [data-sign="colophon"] .sign--colophon { display: flex; }
    [data-sign="plaque"] .sign--plaque { display: block; }
    [data-sign="plain"] .sign--plain { display: block; }

    /* A. 落款行（推荐）：一行、三块，和右侧图标共用同一条 24px 中线 */
    .sign--signature {
      left: 32px;
      bottom: 24px;
      height: 24px;
      align-items: center;
      gap: 12px;
      color: var(--sig-link);
    }

    .sig-name {
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: var(--sig-name);
      white-space: nowrap;
      transition: color 0.6s ease;
    }

    .stage.is-typing .sig-name { color: var(--sig-hover); }

    .sig-rule {
      width: 1px;
      height: 11px;
      background: var(--line-2);
    }

    .sig-links { display: flex; align-items: center; gap: 16px; }

    .sig-links a {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding-bottom: 2px;
      color: var(--sig-link);
      font-size: 12px;
      letter-spacing: 0.01em;
      text-decoration: none;
      white-space: nowrap;
      background-image: linear-gradient(currentColor, currentColor);
      background-repeat: no-repeat;
      background-size: 0 1px;
      background-position: 0 100%;
      transition: color 0.26s cubic-bezier(0.22, 1, 0.36, 1), background-size 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .sig-links a em {
      font-style: normal;
      font-size: 10px;
      opacity: 0.55;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .sig-links a:hover,
    .sig-links a:focus-visible {
      color: var(--sig-hover);
      background-size: 100% 1px;
      outline: none;
    }

    .sig-links a:hover em { opacity: 1; transform: translate(1px, -1px); }

    /* B. 署名条（偏装饰，方案对比用） */
    .sign--colophon {
      left: 32px;
      bottom: 24px;
      align-items: center;
      gap: 14px;
      color: var(--ink-2);
    }

    .mono-mark {
      display: grid;
      place-items: center;
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1px solid rgba(34, 195, 170, 0.45);
      background: rgba(34, 195, 170, 0.07);
      color: var(--teal-bright);
      font: 600 12px/1 var(--font);
      letter-spacing: 0.02em;
    }

    html[data-theme="light"] .mono-mark { color: #0e8b77; }

    .colophon__id { display: flex; flex-direction: column; gap: 3px; }
    .colophon__name { font-size: 12.5px; font-weight: 600; letter-spacing: 0.01em; color: var(--ink); }
    .colophon__sub {
      font-size: 9.5px;
      letter-spacing: 0.14em;
      color: var(--muted);
    }

    .colophon__rule {
      width: 1px;
      height: 26px;
      background: var(--line-2);
      margin: 0 2px;
    }

    .colophon__links { display: flex; align-items: center; gap: 16px; }

    .colophon__links a {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      color: var(--muted);
      font-size: 11.5px;
      letter-spacing: 0.02em;
      text-decoration: none;
      padding-bottom: 2px;
      background-image: linear-gradient(currentColor, currentColor);
      background-repeat: no-repeat;
      background-size: 0 1px;
      background-position: 0 100%;
      transition: color 0.24s ease, background-size 0.28s ease;
    }

    .colophon__links a i {
      font: 500 9px/1 var(--mono);
      font-style: normal;
      color: var(--muted-2);
      letter-spacing: 0.04em;
    }

    .colophon__links a em {
      font-style: normal;
      opacity: 0.5;
      font-size: 9px;
    }

    .colophon__links a:hover,
    .colophon__links a:focus-visible {
      color: var(--teal-bright);
      background-size: 100% 1px;
      outline: none;
    }

    html[data-theme="light"] .colophon__links a:hover { color: #0e8b77; }

    /* C. 馆藏牌 */
    .sign--plaque {
      left: 32px;
      bottom: 24px;
      width: 276px;
      padding: 13px 15px 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(10, 20, 18, 0.52);
      -webkit-backdrop-filter: blur(12px) saturate(1.2);
      backdrop-filter: blur(12px) saturate(1.2);
      box-shadow: 0 18px 50px -20px rgba(0, 0, 0, 0.8);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    html[data-theme="light"] .sign--plaque {
      background: rgba(255, 255, 255, 0.66);
      box-shadow: 0 18px 50px -24px rgba(12, 60, 52, 0.25);
    }

    .sign--plaque:hover { transform: translateY(-2px); border-color: rgba(34, 195, 170, 0.28); }

    .plaque__eyebrow {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .live-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 3px rgba(34, 195, 170, 0.16);
    }

    .plaque__title { margin: 0 0 3px; font-size: 13.5px; font-weight: 600; color: var(--ink); }
    .plaque__text { margin: 0 0 10px; font-size: 11.5px; line-height: 1.6; color: var(--muted); }

    .plaque__links { display: flex; gap: 14px; }
    .plaque__links a {
      font-size: 11px;
      color: var(--ink-2);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 1px;
    }
    .plaque__links a:hover { color: var(--teal-bright); border-color: currentColor; }

    /* D. 现状 */
    .sign--plain {
      left: 20px;
      bottom: 20px;
      max-width: 20%;
      color: #fff;
      font-size: 16px;
      line-height: 1.2;
    }

    .sign--plain a {
      display: inline-block;
      margin: 0 6px;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
    }

    /* ---------- 右侧社交图标 ---------- */

    .social {
      position: fixed;
      right: 32px;
      bottom: 24px;
      z-index: 2;
      height: 24px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    [data-sign="plain"] .social { right: 20px; bottom: 20px; }

    .social a {
      display: grid;
      place-items: center;
      width: 24px; height: 24px;
      color: #8fa5a0;
      opacity: 0.62;
      transition: opacity 0.22s ease, color 0.22s ease, transform 0.22s ease;
    }

    .social a:hover { opacity: 1; color: var(--sig-hover); transform: translateY(-1px); }
    html[data-theme="light"] .social a { color: #3f5350; opacity: 0.8; }

    .social svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .social .glyph { font-size: 15px; font-weight: 600; line-height: 1; }

    /* ---------- 控制条 ---------- */

    .hud {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 14px;
      padding: 8px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(7, 14, 13, 0.78);
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      backdrop-filter: blur(14px) saturate(1.3);
      box-shadow: 0 18px 50px -18px rgba(0, 0, 0, 0.9);
      color: #b9c9c5;
      font-family: var(--font);
      font-size: 11px;
      white-space: nowrap;
    }

    .hud__group { display: flex; align-items: center; gap: 3px; }
    .hud__label { font-size: 9px; letter-spacing: 0.12em; color: #6d817d; margin-right: 3px; }

    .hud button {
      padding: 4px 9px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #a7b8b4;
      font: 500 11px/1.2 var(--font);
      cursor: pointer;
      transition: background-color 0.18s ease, color 0.18s ease;
    }

    .hud button:hover { background: rgba(255, 255, 255, 0.07); color: #e8f2ef; }
    .hud button[aria-pressed="true"] { background: rgba(34, 195, 170, 0.18); color: #7fe7d5; }
    .hud__note { font-size: 9.5px; letter-spacing: 0.06em; color: #647874; }
    .hud[hidden] { display: none; }

    @media (max-width: 900px) {
      .hud__note { display: none; }
    }

    @media (max-width: 720px) {
      .phone { width: 100%; height: 100dvh; border-radius: 0; border: 0; }
      .sign, .social { display: none !important; }
      .hud { top: 8px; padding: 6px 8px; gap: 4px 8px; }
    }
  </style>
</head>

<body data-bg="studio" data-sign="signature" data-theme="dark">
  <div class="stage" id="stage">
    <div class="ambient" aria-hidden="true">
      <div class="a-wash"></div>
      <div class="a-aurora"><i></i><i></i><i></i><i></i></div>
      <div class="a-desk"></div>
      <div class="a-lamp" id="lamp"></div>
      <canvas id="dust"></canvas>

  <div class="hud" role="toolbar" aria-label="方案切换">
    <span class="hud__group">
      <span class="hud__label">背景</span>
      <button type="button" data-bg="current">现状</button>
      <button type="button" data-bg="aurora">极光</button>
      <button type="button" data-bg="firefly">萤火</button>
      <button type="button" data-bg="studio">静室</button>
    </span>
    <span class="hud__group">
      <span class="hud__label">署名</span>
      <button type="button" data-sign="plain">现状</button>
      <button type="button" data-sign="signature">落款行</button>
      <button type="button" data-sign="colophon">署名条</button>
      <button type="button" data-sign="plaque">馆藏牌</button>
    </span>
    <span class="hud__group">
      <span class="hud__label">主题</span>
      <button type="button" data-theme="dark">深</button>
      <button type="button" data-theme="light">浅</button>
    </span>
    <span class="hud__group">
      <span class="hud__label">动效</span>
      <button type="button" data-motion="on">开</button>
      <button type="button" data-motion="off">关</button>
    </span>
    <span class="hud__note">1–4 背景 · Q W E R 署名 · T 主题 · M 动效</span>
  </div>

  <script>
    (function () {
      'use strict';

      var stage = document.getElementById('stage');
      var params = new URLSearchParams(location.search);
      var state = {
        bg: params.get('bg') || 'studio',
        sign: params.get('sign') || 'signature',
        theme: params.get('theme') || 'dark',
        motion: params.get('motion') !== 'off'
      };

      var BG = ['current', 'aurora', 'firefly', 'studio'];
      var SIGN = ['plain', 'signature', 'colophon', 'plaque'];

      function apply(push) {
        document.body.dataset.bg = state.bg;
        document.body.dataset.sign = state.sign;
        document.documentElement.dataset.theme = state.theme;
        document.body.classList.toggle('no-motion', !state.motion);
        stage.classList.toggle('no-motion', !state.motion);

        document.querySelectorAll('.hud button').forEach(function (b) {
          var pressed = false;
          if (b.dataset.bg) pressed = b.dataset.bg === state.bg;
          else if (b.dataset.sign) pressed = b.dataset.sign === state.sign;
          else if (b.dataset.theme) pressed = b.dataset.theme === state.theme;
          else if (b.dataset.motion) pressed = b.dataset.motion === (state.motion ? 'on' : 'off');
          b.setAttribute('aria-pressed', String(pressed));
        });

        if (push) {
          var q = new URLSearchParams();
          q.set('bg', state.bg); q.set('sign', state.sign);
          q.set('theme', state.theme); q.set('motion', state.motion ? 'on' : 'off');
          history.replaceState(null, '', '?' + q.toString());
        }

        dust.setActive(state.bg === 'firefly' && state.motion);
      }

      document.querySelector('.hud').addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.bg) state.bg = b.dataset.bg;
        else if (b.dataset.sign) state.sign = b.dataset.sign;
        else if (b.dataset.theme) state.theme = b.dataset.theme;
        else if (b.dataset.motion) state.motion = b.dataset.motion === 'on';
        apply(true);
      });

      document.addEventListener('keydown', function (e) {
        var k = e.key.toLowerCase();
        if (k >= '1' && k <= '4') { state.bg = BG[+k - 1]; apply(true); }
        else if ('qwer'.indexOf(k) > -1) { state.sign = SIGN['qwer'.indexOf(k)]; apply(true); }
        else if (k === 't') { state.theme = state.theme === 'dark' ? 'light' : 'dark'; apply(true); }
        else if (k === 'm') { state.motion = !state.motion; apply(true); }
      });

      /* ---------- 萤火：预渲染光点贴图，只画 sprite ---------- */

      var dust = (function () {
        var canvas = document.getElementById('dust');
        var ctx = canvas.getContext('2d');
        var parts = [];
        var w = 0, h = 0, dpr = 1;
        var raf = 0, last = 0, active = false;
        var sprites = [];

        function sprite(rgb) {
          var s = document.createElement('canvas');
          s.width = s.height = 64;
          var g = s.getContext('2d');
          var grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
          grad.addColorStop(0, 'rgba(' + rgb + ',0.95)');
          grad.addColorStop(0.32, 'rgba(' + rgb + ',0.42)');
          grad.addColorStop(1, 'rgba(' + rgb + ',0)');
          g.fillStyle = grad;
          g.beginPath();
          g.arc(32, 32, 32, 0, Math.PI * 2);
          g.fill();
          return s;
        }

        sprites[0] = sprite('110,235,208');
        sprites[1] = sprite('242,201,155');

        function resize() {
          dpr = Math.min(1.5, window.devicePixelRatio || 1);
          w = window.innerWidth;
          h = window.innerHeight;
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          seed();
          if (active) draw(0); else ctx.clearRect(0, 0, w, h);
        }

        function seed() {
          var n = 24;
          parts = [];
          for (var i = 0; i < n; i++) {
            var warm = Math.random() < 0.1;
            parts.push({
              x: Math.random() * w,
              y: Math.random() * h,
              r: 5 + Math.random() * 6,
              vy: 0.05 + Math.random() * 0.12,
              sway: 0.4 + Math.random() * 0.9,
              phase: Math.random() * Math.PI * 2,
              a: 0.08 + Math.random() * 0.14,
              warm: warm ? 1 : 0
            });
          }
        }

        function draw(t) {
          ctx.clearRect(0, 0, w, h);
          ctx.globalCompositeOperation = 'source-over';
          for (var i = 0; i < parts.length; i++) {
            var p = parts[i];
            var x = p.x + Math.sin(t * 0.00016 * p.sway + p.phase) * 10;
            var y = p.y - (t * 0.001 * p.vy) % (h + 60);
            if (y < -30) y += h + 60;
            ctx.globalAlpha = p.a;
            ctx.drawImage(sprites[p.warm], x - p.r, y - p.r, p.r * 2, p.r * 2);
          }
          ctx.globalAlpha = 1;
        }

        function frame(now) {
          raf = 0;
          if (!active) return;
          if (now - last >= 41) {
            last = now;
            draw(now);
          }
          raf = requestAnimationFrame(frame);
        }

        function start() {
          if (raf || !active) return;
          last = 0;
          raf = requestAnimationFrame(frame);
        }

        function stop() {
          if (raf) cancelAnimationFrame(raf);
          raf = 0;
          ctx.clearRect(0, 0, w, h);
        }

        function setActive(v) {
          active = v;
          if (!v) { stop(); return; }
          if (state.motion) start(); else { stop(); draw(0); }
        }

        window.addEventListener('resize', resize);
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) stop();
          else if (active && state.motion) start();
        });
        var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        var onMq = function (e) {
          if (e.matches) { stop(); draw(0); }
          else if (active && state.motion) start();
        };
        if (mq.addEventListener) mq.addEventListener('change', onMq);
        else if (mq.addListener) mq.addListener(onMq);

        resize();
        return { setActive: setActive };
      })();

      /* 演示「念真在打字」时背景的呼吸 */
      var typingTimer = 0;
      function breath() {
        stage.classList.add('is-typing');
        clearTimeout(typingTimer);
        typingTimer = setTimeout(function () {
          stage.classList.remove('is-typing');
        }, 2600);
      }
      stage.addEventListener('click', function (e) {
        if (e.target.closest('.phone')) breath();
      });

      if (params.get('hud') === 'off') { document.querySelector('.hud').hidden = true; }

      apply(false);
      if (!params.get('motion') && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        setTimeout(breath, 1200);
      }
    })();
  </script>
</body>
